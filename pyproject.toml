[project]
name = "anamoly-detection-model-training"
version = "0.1.0"
description = "Log anomaly detection model training and scoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn~=1.9.1",  # the models were pickled with 1.9.1
]

[dependency-groups]
notebook = [
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]
